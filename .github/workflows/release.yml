name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  issues: write

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@latest
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check:public
      - run: npm run build
      - run: npm test
      - run: npm run typecheck
      - name: Check tag matches the core package
        if: github.event_name == 'push'
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./packages/core/package.json').version")"
      - name: Verify package contents
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('public-release.json', 'utf8'));
          for (const workspace of config.publishPackages) {
            const output = execFileSync('npm', ['pack', '--dry-run', '--json', '-w', workspace], { encoding: 'utf8' });
            const result = JSON.parse(output);
            const packed = Array.isArray(result) ? result[0] : Object.values(result)[0];
            if (!packed?.files?.length) throw new Error(`${workspace} produced an empty package`);
          }
          NODE

  publish:
    name: Publish to npm
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-production
    outputs:
      published: ${{ steps.targets.outputs.published }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check:public
      - run: npm run build
      - name: Find unpublished package versions
        id: targets
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const config = JSON.parse(readFileSync('public-release.json', 'utf8'));
          const targets = [];
          for (const workspace of config.publishPackages) {
            const pkg = JSON.parse(readFileSync(`${workspace}/package.json`, 'utf8'));
            if (spawnSync('npm', ['view', `${pkg.name}@${pkg.version}`, 'version']).status !== 0) targets.push(workspace);
          }
          if (!targets.length) throw new Error('Every configured package version is already published');
          appendFileSync(process.env.GITHUB_OUTPUT, `published=${targets.join(',')}\n`);
          console.log(`Publishing ${targets.join(', ')}`);
          NODE
      - name: Publish new versions
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          IFS=',' read -r -a targets <<< "${{ steps.targets.outputs.published }}"
          for workspace in "${targets[@]}"; do
            npm publish -w "$workspace" --provenance --access public
          done
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes

  verify-production:
    name: Verify published release
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: node .github/scripts/verify-release.mjs

  report-failure:
    name: Report verification failure
    if: always() && needs.verify-production.result == 'failure'
    needs: verify-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = 'Published SDK release verification failed';
            const body = `Release verification failed in run ${context.runId}: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const existing = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'release-verification', per_page: 1 });
            if (existing.data.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.data[0].number, body });
            } else {
              try { await github.rest.issues.createLabel({ ...context.repo, name: 'release-verification', color: 'b60205' }); } catch (error) { if (error.status !== 422) throw error; }
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['release-verification'] });
            }

  report-success:
    name: Close recovered verification failures
    if: always() && needs.verify-production.result == 'success'
    needs: verify-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'release-verification', per_page: 10 });
            for (const issue of existing.data) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: `Verification passing again in run ${context.runId}. Auto-closing.` });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed' });
            }
